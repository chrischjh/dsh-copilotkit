name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: node --test
      - name: Check the publishable file list
        run: npm pack --dry-run
      - name: Verify the bundle manifest
        run: >
          node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch||!p.dsh?.client?.platform) throw new Error('missing dsh manifest fields'); if(p.name!=='dsh-copilotkit') throw new Error('unexpected package name')"
