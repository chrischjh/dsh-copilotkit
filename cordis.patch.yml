# dsh-copilotkit bundle patch: official CopilotKit skills + the docs MCP server.
# Two rows, each independently disableable from Plugins:
#   dsh-copilotkit      - the bundle plugin: vendored official skills + prompt guidance
#   dsh-copilotkit-docs - @deepseek-ai/dsh-mcp-client bridging https://mcp.copilotkit.ai/mcp
- insert:
    - id: dsh-copilotkit
      name: 'dsh-copilotkit'
      config: {}
    - id: dsh-copilotkit-docs
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: copilotkit
        transport: streamable-http
        url: https://mcp.copilotkit.ai/mcp
        failOnStartupError: false
        startupTimeoutMs: 20000
        toolCallTimeoutMs: 45000
